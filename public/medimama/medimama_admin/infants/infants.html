<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MediMama Admin - Infants</title><link rel="stylesheet" href="infants.css"></head>
<body>
    <div data-medimama-sidebar></div>
    <main class="main-content directory-page">
        <header class="page-header"><div><p class="eyebrow">Patient management</p><h1>Infant Directory</h1><p>View registered infants and their health record status.</p></div><button class="primary-button" type="button" id="addInfant"><i class="fa-solid fa-baby"></i> Add infant</button></header>
        <section class="summary-grid"><article><i class="fa-solid fa-baby"></i><span><b id="totalCount">0</b><small>Registered infants</small></span></article><article><i class="fa-solid fa-syringe pink"></i><span><b id="immunizationCount">0</b><small>Immunizations scheduled</small></span></article><article><i class="fa-solid fa-heart-pulse teal"></i><span><b>1</b><small>Needs follow-up</small></span></article></section>
        <section class="directory-panel"><div class="directory-tools"><label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" type="search" placeholder="Search infant, mother, or record ID"></label><select id="statusFilter" aria-label="Filter by record status"><option value="all">All record statuses</option><option value="Active">Active</option><option value="Needs follow-up">Needs follow-up</option></select></div><div class="table-wrap"><table><thead><tr><th>Infant</th><th>Record ID</th><th>Age / sex</th><th>Mother / guardian</th><th>Record status</th><th></th></tr></thead><tbody id="infantRows"></tbody></table></div></section>
    </main>
    <div class="profile-modal" id="profileModal" aria-hidden="true" role="dialog" aria-modal="true"><div class="profile-card"><button id="closeProfile" class="close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><div id="profileContent"></div></div></div><div class="toast" id="toast" role="status"></div>
    <script src="../sidebar/sidebar-loader.js"></script><script src="../../medimama-core.js"></script><script src="infants.js"></script>
</body></html>
